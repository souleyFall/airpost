services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      # Les valeurs viennent du fichier .env. Le « :? » arrête tout avec un message clair si une variable manque.
      POSTGRES_USER: ${POSTGRES_USER:?Ajoute POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ajoute POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?Ajoute POSTGRES_DB dans .env}
    ports:
      # 127.0.0.1 : la base n'est joignable que depuis ton ordinateur, jamais depuis le réseau.
      - '127.0.0.1:5432:5432'
    volumes:
      # Les données survivent à l'arrêt du conteneur.
      - airpost-db:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Variables listées une à une : l'API ne reçoit pas tout le .env (clés d'API des autres modules).
    environment:
      API_PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    ports:
      # Même règle que la base : joignable depuis cet ordinateur seulement.
      - '127.0.0.1:3000:3000'
    # Système de fichiers en lecture seule, aucune capacité Linux superflue, pas d'élévation de droits.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  airpost-db:
