services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      # Les valeurs viennent du fichier .env. Le « :? » arrête tout avec un message clair si une variable manque.
      POSTGRES_USER: ${POSTGRES_USER:?Ajoute POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ajoute POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?Ajoute POSTGRES_DB dans .env}
    ports:
      # 127.0.0.1 : la base n'est joignable que depuis ton ordinateur, jamais depuis le réseau.
      - '127.0.0.1:5432:5432'
    volumes:
      # Les données survivent à l'arrêt du conteneur.
      - airpost-db:/var/lib/postgresql/data
    # Prêt = accepte les connexions TCP. L'API et les migrations attendent ce signal.
    # « -h 127.0.0.1 » est indispensable : pendant l'initialisation d'un volume vide, l'image démarre un
    # serveur temporaire qui n'écoute que sur le socket Unix ; sans cette option le test réussirait trop tôt.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Variables listées une à une : l'API ne reçoit pas tout le .env (clés d'API des autres modules).
    environment:
      API_PORT: 3000
      # Dans le réseau Compose la base s'appelle « db » (et non « localhost », valeur du .env pour le développement
      # hors Docker). Un mot de passe contenant @ : / ? # doit être encodé en pourcentage dans une URL.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      # Usage local en http (127.0.0.1) : un cookie « Secure » ne serait pas renvoyé. Mettre « true » dès que
      # l'application est servie en HTTPS (hébergement). L'API n'est de toute façon publiée que sur 127.0.0.1.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    ports:
      # Même règle que la base : joignable depuis cet ordinateur seulement.
      - '127.0.0.1:3000:3000'
    # Système de fichiers en lecture seule, aucune capacité Linux superflue, pas d'élévation de droits.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Commande ponctuelle : `docker compose run --rm migrate` applique les migrations à la base.
  # Elle utilise l'étape de construction de l'image (qui contient l'outil Prisma, absent de l'image finale).
  migrate:
    profiles: [tools]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ['pnpm', '--filter', '@airpost/api', 'exec', 'prisma', 'migrate', 'deploy']
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  airpost-db:
