# Serveur de l'interface : fichiers statiques + relais de /api vers l'API.
# Un seul point d'entrée pour le navigateur => une seule origine => cookie de session SameSite=Strict sans CORS.

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Les requêtes de l'application sont petites : refuser le reste limite les abus.
  client_max_body_size 64k;

  # En-têtes de sécurité sur toutes les réponses (y compris les erreurs).
  # CSP : seulement des ressources de la même origine ; aucun script ni style en ligne ; pas d'iframe.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    # Remplace (et n'ajoute pas à) l'en-tête reçu : un client ne peut pas se faire passer pour une autre adresse.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    # La génération d'une lettre peut durer plusieurs secondes.
    proxy_read_timeout 60s;
    # Les réponses de l'API ne doivent jamais être mises en cache (données personnelles).
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Fichiers à nom haché : cache d'un an sans risque.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Application monopage : toute autre adresse renvoie l'index (le routeur de l'interface prend le relais).
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri /index.html;
  }
}
