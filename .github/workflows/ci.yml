name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Exécution hebdomadaire : seul l'audit tourne (voir `if` des autres jobs), pour détecter
  # une faille publiée après la dernière PR.
  schedule:
    - cron: '17 5 * * 1'

# Principe du moindre privilège : le jeton du workflow ne peut que lire le dépôt.
permissions:
  contents: read

# Une nouvelle exécution annule la précédente pour la même PR, mais jamais celle de `main`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Les actions sont figées par empreinte de commit (le commentaire donne la version lisible).
# Dependabot propose leur mise à jour.
jobs:
  quality:
    name: Qualité (lint, formatage, types, tests, build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  audit:
    name: Audit des dépendances (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Pas d'installation : l'audit ne lit que le fichier de verrouillage.
      - run: pnpm audit --prod --audit-level=high

  secrets:
    name: Recherche de secrets dans l'historique
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
